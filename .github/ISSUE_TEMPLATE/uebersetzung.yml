name: Übersetzung verbessern / Translation issue
description: The English version reads wrong or misses something
title: "Translation: "
labels: ["übersetzung"]
body:
  - type: input
    id: url
    attributes:
      label: Page
      placeholder: https://yourhomelab.guide/en/wiki/…
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what would be better?
    validations:
      required: true
