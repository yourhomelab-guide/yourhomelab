# yaml-language-server: $schema=../../../.astro/collections/services.schema.json
# Metadata of the service. All fields are documented in CONTRIBUTING.md.
name: My Service
# proxy | management | data | code | auth | monitoring
category: data
# 1 = Einsteiger, 2 = Fortgeschritten, 3 = Profi
level: 1
# optional badge: recommended | popular | new
# tag: new
# Port the web UI listens on INSIDE the container
port: 8080
# Port published on the host when the visitor uses no reverse proxy (defaults to port)
# hostPort: 8080
# Subdomain (sub.example.com) or path (example.com/sub)
subdomain: myservice
# true if the app cannot run under a path like example.com/myservice
subdomainOnly: false
links:
  # owner/repo on GitHub, or a full URL for Codeberg etc.
  repo: owner/myservice
  website: https://example.org
  docs: https://example.org/docs
upstream:
  label: docker-compose.yml
  url: https://github.com/owner/myservice/blob/main/docker-compose.yml
# Date you last tested this template (YYYY-MM-DD)
reviewed: 2026-10-01
# Does a GPU help (transcoding, machine learning)? Shown on the service page
# gpu: no            # no | optional | recommended
# Database of the stack, used for backup dumps (borgmatic tool)
# db:
#   type: postgres    # postgres | mariadb | mysql | sqlite
#   service: myservice-db   # service name of the database container in compose.yaml (not for sqlite)
#   user: ${POSTGRES_USER}  # literal or ${VAR} from .env
#   name: ${POSTGRES_DB}
#   path: data/data/db.sqlite3   # sqlite only: path of the database file below the stack folder
# Ids of other services that go well with this one ("Passt gut zu")
# pairsWith: [pocket-id, tinyauth]
