services:
  vaultwarden:
    # latest = newest stable release (as in the official docs). For a password manager,
    # security fixes should arrive quickly. To pin, use a full version like 1.37.3.
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DOMAIN=__URL__
      # No open registration: invite users on the admin page instead
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ./data/data:/data
