services:
  ntfy:
    image: binwiederhier/ntfy:v2
    container_name: ntfy
    restart: unless-stopped
    command: serve
    # Needed for the healthcheck, prevents zombie processes
    init: true
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=__URL__
      # Message cache and user database (SQLite), kept in ./data
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      # Private server: nobody may read or write without an account
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      # Real client IPs from the reverse proxy (for rate limiting)
      - NTFY_BEHIND_PROXY=true
      # Instant notifications on iOS: sends only a message ID to ntfy.sh
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ./data/data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
