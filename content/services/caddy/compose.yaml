services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/data:/data
      - ./data/config:/config
    networks:
      - __NETWORK__

networks:
  __NETWORK__:
    external: true
